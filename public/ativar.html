<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ativar Tag - Orbitek Pets</title>

  <link
    rel="stylesheet"
    href="/css/geral.css"
  >

  <link
    rel="stylesheet"
    href="/css/ativar.css"
  >
</head>

<body>
  <main class="pagina-ativacao">
    <section class="cartao-ativacao">

      <div class="cabecalho-ativacao">
        <span
          class="indicador-etapa"
          id="indicadorEtapa"
        >
          Etapa 1 de 3
        </span>

        <h1 id="tituloEtapa">
          Ative sua Tag Orbitek
        </h1>

        <p id="descricaoEtapa">
          Primeiro, conte algumas informações sobre o seu pet.
        </p>

        <div class="codigo-tag">
          <span>Tag</span>

          <strong id="codigoTagExibido">
            Carregando...
          </strong>
        </div>
      </div>

      <form id="formularioAtivacao">

        <!-- ETAPA 1 -->
        <section
          class="etapa-formulario ativa"
          id="etapa1"
        >
          <div class="grupo-campo campo-completo">
            <label for="nomePet">
              Nome do pet
            </label>

            <input
              type="text"
              id="nomePet"
              autocomplete="off"
              placeholder="Exemplo: Thor"
            >
          </div>

          <div class="grupo-campo campo-completo">
            <label for="especiePet">
              Espécie
            </label>

            <select id="especiePet">
              <option value="">
                Selecione
              </option>

              <option value="Cachorro">
                Cachorro
              </option>

              <option value="Gato">
                Gato
              </option>

              <option value="Outro">
                Outro
              </option>
            </select>
          </div>

          <div class="grupo-campo campo-completo">
            <label for="fotoPet">
              Foto do pet
              <span>(opcional)</span>
            </label>

            <input
              type="file"
              id="fotoPet"
              accept="image/jpeg,image/png,image/webp"
            >

            <small class="mensagem-campo">
              Envie uma imagem JPG, PNG ou WEBP de até 5 MB.
            </small>

            <div
              class="preview-foto escondido"
              id="previewFoto"
            >
              <img
                id="imagemPreview"
                alt="Pré-visualização da foto do pet"
              >

              <button
                type="button"
                class="botao-remover-foto"
                id="botaoRemoverFoto"
              >
                Remover foto
              </button>
            </div>
          </div>
        </section>

        <!-- ETAPA 2 -->
        <section
          class="etapa-formulario"
          id="etapa2"
        >
          <div class="grupo-campo campo-completo">
            <label for="nomeTutor">
              Nome do tutor
            </label>

            <input
              type="text"
              id="nomeTutor"
              autocomplete="name"
              placeholder="Seu nome completo"
            >
          </div>

          <div class="grade-campos">
            <div class="grupo-campo">
              <label for="telefoneTutor">
                WhatsApp
              </label>

              <input
                type="tel"
                id="telefoneTutor"
                autocomplete="tel"
                inputmode="numeric"
                maxlength="15"
                placeholder="(41) 99999-9999"
              >
            </div>

            <div class="grupo-campo">
              <label for="cepTutor">
                CEP
              </label>

              <input
                type="text"
                id="cepTutor"
                autocomplete="postal-code"
                inputmode="numeric"
                maxlength="9"
                placeholder="00000-000"
              >

              <small
                id="mensagemCep"
                class="mensagem-campo"
              ></small>
            </div>
          </div>

          <div class="grupo-campo campo-completo">
            <label for="emailTutor">
              E-mail
            </label>

            <input
              type="email"
              id="emailTutor"
              autocomplete="email"
              inputmode="email"
              placeholder="voce@email.com"
            >

            <small class="mensagem-campo">
              Este e-mail será usado para acessar o painel do tutor.
            </small>
          </div>

          <div class="grupo-campo campo-completo">
            <label for="logradouroTutor">
              Rua
            </label>

            <input
              type="text"
              id="logradouroTutor"
              autocomplete="address-line1"
              placeholder="Preenchida pelo CEP"
              readonly
            >
          </div>

          <div class="grade-campos">
            <div class="grupo-campo">
              <label for="bairroTutor">
                Bairro
              </label>

              <input
                type="text"
                id="bairroTutor"
                readonly
              >
            </div>

            <div class="grupo-campo">
              <label for="cidadePet">
                Cidade
              </label>

              <input
                type="text"
                id="cidadePet"
                readonly
              >
            </div>
          </div>

          <div class="grade-campos">
            <div class="grupo-campo">
              <label for="estadoTutor">
                Estado
              </label>

              <input
                type="text"
                id="estadoTutor"
                maxlength="2"
                readonly
              >
            </div>

            <div class="grupo-campo">
              <label for="numeroTutor">
                Número
              </label>

              <input
                type="text"
                id="numeroTutor"
                placeholder="Exemplo: 120"
              >
            </div>
          </div>

          <div class="grupo-campo campo-completo">
            <label for="complementoTutor">
              Complemento
              <span>(opcional)</span>
            </label>

            <input
              type="text"
              id="complementoTutor"
              placeholder="Exemplo: casa 2, apartamento 15"
            >
          </div>
        </section>

        <!-- ETAPA 3 -->
        <section
          class="etapa-formulario"
          id="etapa3"
        >
          <div class="grade-campos">
            <div class="grupo-campo">
              <label for="racaPet">
                Raça
              </label>

              <input
                type="text"
                id="racaPet"
                placeholder="Exemplo: Shih-tzu"
              >
            </div>

            <div class="grupo-campo">
              <label for="sexoPet">
                Sexo
              </label>

              <select id="sexoPet">
                <option value="">
                  Selecione
                </option>

                <option value="Macho">
                  Macho
                </option>

                <option value="Fêmea">
                  Fêmea
                </option>
              </select>
            </div>

            <div class="grupo-campo">
              <label for="idadePet">
                Idade
              </label>

              <input
                type="text"
                id="idadePet"
                placeholder="Exemplo: 3 anos"
              >
            </div>
          </div>

          <div class="grupo-campo campo-completo">
            <label for="comportamentoPet">
              Comportamento
            </label>

            <textarea
              id="comportamentoPet"
              rows="4"
              placeholder="Exemplo: dócil, medroso, não gosta de outros cães..."
            ></textarea>
          </div>
        </section>

        <p
          class="mensagem-formulario"
          id="mensagemFormulario"
        ></p>

        <div class="acoes-formulario">
          <button
            type="button"
            class="botao-secundario escondido"
            id="botaoVoltar"
          >
            Voltar
          </button>

          <button
            type="submit"
            class="botao-principal"
            id="botaoContinuar"
          >
            Continuar
          </button>
        </div>
      </form>

    </section>
  </main>

  <script src="/js/ativar.js"></script>
</body>
</html>
