<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2463eb"><title>Auditoria | BIRX Pets</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18233f;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}.cabecalho{display:flex;align-items:center;gap:20px;padding:20px max(24px,calc((100% - 1180px)/2));background:linear-gradient(135deg,#17388f,#3277f5);color:#fff}.marca img{width:120px;padding:8px;border-radius:12px;background:#fff;display:block}.titulo{flex:1}.titulo span{font-size:.72rem;font-weight:900;letter-spacing:.1em}.titulo h1{margin:4px 0 0;font-size:1.65rem}.cabecalho nav{display:flex;gap:8px;flex-wrap:wrap}.cabecalho nav a{padding:10px 14px;border-radius:10px;color:#fff;text-decoration:none;font-weight:800;background:rgba(255,255,255,.12)}.cabecalho nav a.ativo{background:#fff;color:#225bd3}main{width:min(1180px,calc(100% - 28px));margin:24px auto 50px}.card{margin-bottom:18px;padding:20px;border:1px solid #dfe5f0;border-radius:18px;background:#fff;box-shadow:0 8px 30px rgba(25,45,90,.06)}.acesso{width:min(520px,100%);margin:60px auto}.acesso form,.filtros{display:flex;gap:10px;flex-wrap:wrap}.acesso input,.filtros input{min-height:44px;padding:0 13px;border:1px solid #d8dfeb;border-radius:11px;font:inherit}.acesso input{flex:1}.filtros input{flex:1;min-width:220px}button{min-height:42px;padding:0 15px;border:0;border-radius:11px;background:#2463eb;color:#fff;font-weight:850;cursor:pointer}.secundario{background:#eef3ff;color:#3153a5}.mensagem{margin:14px 0;padding:12px 14px;border-radius:11px;background:#edf8f1;color:#17623e}.mensagem.erro{background:#fff0f1;color:#a72235}.topo-lista{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.tabela{overflow:auto;border:1px solid #e4e9f2;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:13px 14px;border-bottom:1px solid #edf1f6;text-align:left;vertical-align:top}th{background:#f7f9fd;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:#65728a}.acao{font-weight:850;color:#2458c8}.alvo{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.detalhes{white-space:pre-wrap;font-size:.82rem;color:#647089;max-width:420px}.paginacao{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:14px}.vazio{padding:28px;text-align:center;color:#738097}@media(max-width:780px){.cabecalho{align-items:flex-start;flex-wrap:wrap;padding:16px}.cabecalho nav{width:100%}.cabecalho nav a{flex:1;text-align:center}.topo-lista{align-items:stretch;flex-direction:column}.filtros{flex-direction:column}}</style></head><body><header class="cabecalho"><a class="marca" href="/"><img src="/assets/login.png" alt="BIRX Pets"></a><div class="titulo"><span>ÁREA ADMINISTRATIVA</span><h1>Histórico e Auditoria</h1></div><nav><a href="/admin-tags.html">Tags</a><a href="/producao.html">Produção</a><a class="ativo" href="/admin-auditoria.html">Auditoria</a></nav></header><main><section id="acesso" class="card acesso"><h2>Acesso protegido</h2><p>Use a mesma chave administrativa.</p><form id="formAcesso"><input id="chaveAdmin" type="password" autocomplete="current-password" placeholder="Chave administrativa" required><button type="submit">Entrar</button></form><div id="mensagemAcesso" class="mensagem" hidden></div></section><div id="painel" hidden><section class="card"><div class="topo-lista"><div><h2 style="margin:0">Eventos administrativos</h2><p style="margin:6px 0 0;color:#6c788f">Operações registradas automaticamente para rastreabilidade.</p></div><button id="atualizar" class="secundario" type="button">Atualizar</button></div><div class="filtros"><input id="acao" placeholder="Filtrar por ação (ex.: nfc.confirmar)"><input id="alvo" placeholder="Filtrar por código/lote"><button id="filtrar" type="button">Filtrar</button></div><div
