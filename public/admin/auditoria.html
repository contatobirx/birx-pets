<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditoria | BIRX Admin</title><link rel="stylesheet" href="/admin/css/admin.css?v=1.1"><link rel="stylesheet" href="/admin/css/operacoes.css?v=1.0"></head><body><div class="admin-shell"><aside class="sidebar"><div class="brand"><a href="/"><img src="/assets/login.png" alt="BIRX Pets"></a></div><nav class="menu"><a class="menu-item" href="/admin/">Dashboard</a><a class="menu-item" href="/admin/materiais.html">Materiais</a><a class="menu-item" href="/admin/estoque.html">Estoque</a><a class="menu-item" href="/admin/produtos.html">Produtos</a><a class="menu-item" href="/admin/central-producao.html">Central de Produção</a><a class="menu-item active" href="/admin/auditoria.html">Auditoria</a></nav></aside><main class="main-content"><header class="topbar"><div><span class="eyebrow">CONSISTÊNCIA</span><h1>Auditoria do Sistema</h1></div><button class="primary" id="atualizar">Verificar agora</button></header><div id="msg" class="feedback" hidden></div><section class="stats-grid"><article class="stat-card"><div><span>Status</span><strong id="status">—</strong><small>saúde geral do ERP</small></div></article><article class="stat-card"><div><span>Problemas</span><strong id="problemas">0</strong><small>itens que exigem revisão</small></div></article><article class="stat-card"><div><span>Tags em estoque</span><strong id="tagsEstoque">0</strong><small>mesma regra do admin-tags</small></div></article><article class="stat-card"><div><span>Tags totais</span><strong id="tagsTotal">0</strong><small>histórico completo</small></div></article></section><section class="panel"><div class="panel-header"><div><span class="eyebrow">CHECKLIST</span><h3>Verificações de consistência</h3></div></div><div id="checks" class="quick-actions"></div></section></main></div><script src="/admin/js/ui.js?v=1.9"></script><script>const ui=BirxAdmin,$=id=>document.getElementById(id);function render(d){$('status').textContent=d.saudavel?'OK':'REVISAR';$('problemas').textContent=ui.qty.format(Number(d.problemas||0));$('tagsEstoque').textContent=ui.qty.format(Number(d.resumo_tags?.estoque||0));$('tagsTotal').textContent=ui.qty.format(Number(d.resumo_tags?.total||0));$('checks').innerHTML=(d.checks||[]).map(c=>`<div class="action-card"><span class="action-icon">${c.quantidade?c.nivel==='erro'?'!':'⚠':'✓'}</span><div><strong>${ui.escapeHtml(c.titulo)}</strong><small>${c.quantidade?`${c.quantidade} ocorrência(s)`:'Nenhuma inconsistência encontrada'}</small>${c.quantidade&&c.detalhes?.length?`<small>${ui.escapeHtml(c.detalhes.slice(0,5).map(x=>x.nome||x.produto||x.codigo||('#'+x.id)).join(' · '))}</small>`:''}</div><b>${c.quantidade?'Revisar':'OK'}</b></div>`).join('')}async function load(){if(!await ui.requireAuth())return;const d=await ui.api('/api/auditoria');render(d);ui.feedback($('msg'),d.saudavel?'Auditoria concluída sem inconsistências.':`Auditoria encontrou ${d.problemas} item(ns) para revisar.`,!d.saudavel)}$('atualizar').onclick=()=>load().catch(e=>ui.feedback($('msg'),e.message,true));load().catch(e=>ui.feedback($('msg'),e.message,true));</script></body></html>
