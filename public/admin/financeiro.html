<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro | BIRX Admin</title><link rel="stylesheet" href="/admin/css/admin.css?v=1.1"><link rel="stylesheet" href="/admin/css/operacoes.css?v=1.0"></head><body><div class="admin-shell"><aside class="sidebar"><div class="brand"><a href="/"><img src="/assets/login.png" alt="BIRX Pets"></a></div><nav class="menu"><a class="menu-item" href="/admin/">Dashboard</a><a class="menu-item" href="/admin/crm.html">CRM</a><a class="menu-item" href="/admin/pedidos.html">Pedidos</a><a class="menu-item active" href="/admin/financeiro.html">Financeiro</a><a class="menu-item" href="/admin/compras.html">Compras</a></nav></aside><main class="main-content"><header class="topbar"><div><span class="eyebrow">FINANCEIRO</span><h1>Fluxo Financeiro</h1></div><button class="primary" id="novo">+ Novo lançamento</button></header><section class="stats-grid"><article class="stat-card"><div><span>A receber</span><strong id="receber">R$ 0,00</strong></div></article><article class="stat-card"><div><span>A pagar</span><strong id="pagar">R$ 0,00</strong></div></article><article class="stat-card"><div><span>Recebido</span><strong id="recebido">R$ 0,00</strong></div></article><article class="stat-card"><div><span>Pago</span><strong id="pago">R$ 0,00</strong></div></article></section><section class="panel"><div id="msg" class="feedback" hidden></div><div class="table-wrap"><table><thead><tr><th>Tipo</th><th>Descrição</th><th>Origem</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section></main></div><div class="modal" id="modal" hidden><div class="modal-overlay" data-close></div><section class="modal-card"><div class="modal-head"><h2>Novo lançamento</h2><button class="icon-button" data-close>×</button></div><form id="form" class="form-grid"><label>Tipo<select id="tipo"><option value="receber">A receber</option><option value="pagar">A pagar</option></select></label><label>Valor<input id="valor" type="number" min="0" step="0.01" required></label><label class="full">Descrição<input id="descricao" required></label><label>Vencimento<input id="vencimento" type="date"></label><div class="form-actions full"><button type="button" class="secondary" data-close>Cancelar</button><button class="primary">Salvar</button></div></form></section></div><script src="/admin/js/ui.js?v=1.10"></script><script>const ui=BirxAdmin,$=id=>document.getElementById(id);let itens=[];function render(d){$('receber').textContent=ui.money.format(Number(d.resumo?.receber_aberto||0));$('pagar').textContent=ui.money.format(Number(d.resumo?.pagar_aberto||0));$('recebido').textContent=ui.money.format(Number(d.resumo?.recebido||0));$('pago').textContent=ui.money.format(Number(d.resumo?.pago||0));$('lista').innerHTML=itens.map(i=>`<tr><td>${i.tipo==='receber'?'A receber':'A pagar'}</td><td><strong>${ui.escapeHtml(i.descricao)}</strong></td><td>${ui.escapeHtml(i.origem||'manual')}</td><td>${ui.money.format(Number(i.valor||0))}</td><td>${ui.escapeHtml((i.vencimento||'—').slice(0,10))}</td><td><strong>${ui.escapeHtml(i.status)}</strong></td><td>${i.status==='aberto'?`<button data-pay="${i.id}">Marcar pago</button> <button class="secondary" data-cancel="${i.id}">Cancelar</button>`:'—'}</td></tr>`).join('')}async function load(){if(!await ui.requireAuth())return;const d=await ui.api('/api/financeiro');itens=d.lancamentos||[];render(d)}function close(){$('modal').hidden=true}document.querySelectorAll('[data-close]').forEach(x=>x.onclick=close);$('novo').onclick=()=>{$('form').reset();$('modal').hidden=false};$('form').onsubmit=async e=>{e.preventDefault();await ui.api('/api/financeiro',{method:'POST',body:JSON.stringify({tipo:$('tipo').value,descricao:$('descricao').value,valor:$('valor').value,vencimento:$('vencimento').value})});close();await load();ui.feedback($('msg'),'Lançamento criado.')};$('lista').onclick=async e=>{const p=e.target.closest('[data-pay]'),c=e.target.closest('[data-cancel]');if(!p&&!c)return;await ui.api('/api/financeiro',{method:'PUT',body:JSON.stringify({id:(p||c).dataset[p?'pay':'cancel'],status:p?'pago':'cancelado'})});await load()};load();</script></body></html>
