<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM | BIRX Admin</title><link rel="stylesheet" href="/admin/css/admin.css?v=1.1"><link rel="stylesheet" href="/admin/css/operacoes.css?v=1.0"></head><body><div class="admin-shell"><aside class="sidebar"><div class="brand"><a href="/"><img src="/assets/login.png" alt="BIRX Pets"></a></div><nav class="menu"><a class="menu-item" href="/admin/">Dashboard</a><a class="menu-item active" href="/admin/crm.html">CRM</a><a class="menu-item" href="/admin/pedidos.html">Pedidos</a><a class="menu-item" href="/admin/produtos.html">Produtos</a><a class="menu-item" href="/admin/estoque.html">Estoque</a><a class="menu-item" href="/admin/central-producao.html">Central de Produção</a></nav></aside><main class="main-content"><header class="topbar"><div><span class="eyebrow">COMERCIAL</span><h1>CRM Pet Shops e Clínicas</h1></div><button class="primary" id="novo">+ Novo contato</button></header><section class="panel"><div class="toolbar"><div><span class="eyebrow">PIPELINE</span><h3>Prospectos e clientes</h3></div><input id="busca" type="search" placeholder="Buscar nome, cidade ou contato"></div><div id="msg" class="feedback" hidden></div><div class="table-wrap"><table><thead><tr><th>Estabelecimento</th><th>Contato</th><th>Status</th><th>Próximo retorno</th><th>Interesse</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section></main></div><div class="modal" id="modal" hidden><div class="modal-overlay" data-close></div><section class="modal-card"><div class="modal-head"><h2 id="titulo">Novo contato</h2><button class="icon-button" data-close>×</button></div><form id="form" class="form-grid"><input id="id" type="hidden"><label>Tipo<select id="tipo"><option value="petshop">Pet shop</option><option value="clinica">Clínica</option><option value="distribuidor">Distribuidor</option><option value="outro">Outro</option></select></label><label>Status<select id="status"><option value="lead">Lead</option><option value="contato">Contato feito</option><option value="negociacao">Negociação</option><option value="cliente">Cliente</option><option value="inativo">Inativo</option></select></label><label class="full">Nome do estabelecimento<input id="nome" required></label><label>Cidade<input id="cidade"></label><label>Estado<input id="estado"></label><label>Responsável<input id="contato"></label><label>WhatsApp<input id="whatsapp"></label><label>Instagram<input id="instagram"></label><label>E-mail<input id="email" type="email"></label><label>Última interação<input id="ultima" type="date"></label><label>Próximo retorno<input id="retorno" type="date"></label><label class="full">Interesse<input id="interesse" placeholder="Ex.: Birx ID personalizada, expositor"></label><label class="full">Observações<textarea id="obs" rows="4"></textarea></label><div class="form-actions full"><button type="button" class="secondary" data-close>Cancelar</button><button class="primary">Salvar</button></div></form></section></div><script src="/admin/js/ui.js?v=1.10"></script><script>const ui=BirxAdmin,$=id=>document.getElementById(id);let itens=[];function render(){const q=$('busca').value.toLowerCase();$('lista').innerHTML=itens.filter(i=>`${i.nome} ${i.cidade||''} ${i.contato_nome||''}`.toLowerCase().includes(q)).map(i=>`<tr><td><strong>${ui.escapeHtml(i.nome)}</strong><br><small>${ui.escapeHtml(i.tipo)} · ${ui.escapeHtml([i.cidade,i.estado].filter(Boolean).join('/'))}</small></td><td>${ui.escapeHtml(i.contato_nome||'—')}<br><small>${ui.escapeHtml(i.whatsapp||i.instagram||'')}</small></td><td><strong>${ui.escapeHtml(i.status)}</strong></td><td>${ui.escapeHtml(i.proximo_retorno||'—')}</td><td>${ui.escapeHtml(i.interesse||'—')}</td><td><button data-edit="${i.id}">Editar</button> <a class="secondary" href="/admin/pedidos.html?cliente_id=${i.id}">Novo pedido</a> <button class="secondary" data-del="${i.id}">Arquivar</button></td></tr>`).join('')}async function load(){if(!await ui.requireAuth())return;const d=await ui.api('/api/crm');itens=d.contatos||[];render()}function open(i=null){$('form').reset();$('id').value=i?.id||'';$('titulo').textContent=i?'Editar contato':'Novo contato';$('tipo').value=i?.tipo||'petshop';$('status').value=i?.status||'lead';$('nome').value=i?.nome||'';$('cidade').value=i?.cidade||'';$('estado').value=i?.estado||'';$('contato').value=i?.contato_nome||'';$('whatsapp').value=i?.whatsapp||'';$('instagram').value=i?.instagram||'';$('email').value=i?.email||'';$('ultima').value=(i?.ultima_interacao||'').slice(0,10);$('retorno').value=(i?.proximo_retorno||'').slice(0,10);$('interesse').value=i?.interesse||'';$('obs').value=i?.observacoes||'';$('modal').hidden=false}function close(){$('modal').hidden=true}document.querySelectorAll('[data-close]').forEach(x=>x.onclick=close);$('novo').onclick=()=>open();$('busca').oninput=render;$('lista').onclick=async e=>{const ed=e.target.closest('[data-edit]');if(ed)return open(itens.find(i=>String(i.id)===ed.dataset.edit));const del=e.target.closest('[data-del]');if(del&&confirm('Arquivar este contato?')){await ui.api(`/api/crm?id=${del.dataset.del}`,{method:'DELETE'});await load()}};$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value;await ui.api('/api/crm',{method:id?'PUT':'POST',body:JSON.stringify({id:id||undefined,tipo:$('tipo').value,status:$('status').value,nome:$('nome').value,cidade:$('cidade').value,estado:$('estado').value,contato_nome:$('contato').value,whatsapp:$('whatsapp').value,instagram:$('instagram').value,email:$('email').value,ultima_interacao:$('ultima').value,proximo_retorno:$('retorno').value,interesse:$('interesse').value,observacoes:$('obs').value})});close();await load();ui.feedback($('msg'),'Contato salvo.')};load();</script></body></html>
