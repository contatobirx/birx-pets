<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Impressoras | BIRX Admin</title><link rel="stylesheet" href="/admin/css/admin.css?v=2.0"><link rel="stylesheet" href="/admin/css/operacoes.css?v=1.0"></head><body><div class="admin-shell"><aside class="sidebar"><div class="brand"><a href="/"><img src="/assets/login.png" alt="BIRX Pets"></a></div><nav class="menu"><a class="menu-item" href="/admin/">Dashboard</a><a class="menu-item" href="/admin/materiais.html">Materiais</a><a class="menu-item" href="/admin/produtos.html">Produtos</a><a class="menu-item" href="/admin/modelos-3d.html">Modelos 3D</a><a class="menu-item active" href="/admin/impressoras.html">Impressoras</a><a class="menu-item" href="/admin/central-producao.html">Central de Produção</a></nav></aside><main class="main-content"><header class="topbar"><div><span class="eyebrow">FROTA 3D</span><h1>Impressoras</h1></div><button class="primary" id="novo">+ Nova impressora</button></header><div id="msg" class="feedback" hidden></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Impressora</th><th>Configuração</th><th>Status ao vivo</th><th>Trabalho</th><th>Temperaturas</th><th>Local</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section></main></div><div class="modal" id="modal" hidden><div class="modal-overlay" data-close></div><section class="modal-card"><div class="modal-head"><h2 id="titulo">Nova impressora</h2><button class="icon-button" data-close>×</button></div><form id="form" class="form-grid"><input id="id" type="hidden"><label>Nome<input id="nome" required placeholder="Ex.: Bambu A1 #1"></label><label>Modelo<input id="modelo" placeholder="Bambu Lab A1"></label><label>Bico (mm)<input id="bico" type="number" step="0.1" value="0.4"></label><label>Material padrão<input id="material" placeholder="PETG"></label><label>Status manual<select id="status"><option value="livre">Livre</option><option value="imprimindo">Imprimindo</option><option value="pausada">Pausada</option><option value="manutencao">Manutenção</option><option value="offline">Offline</option></select></label><label>Localização<input id="local"></label><label class="full">Observações<textarea id="obs" rows="3"></textarea></label><div class="form-actions full"><button type="button" class="secondary" data-close>Cancelar</button><button class="primary">Salvar</button></div></form></section></div><script src="/admin/js/ui.js?v=1.8"></script><script src="/admin/js/admin.js?v=2.0"></script><script>const ui=BirxAdmin,$=id=>document.getElementById(id);let itens=[];const fmt=n=>n==null?'—':ui.qty.format(Number(n));function online(i){if(!i.telemetria_ultimo_contato)return false;const t=new Date(String(i.telemetria_ultimo_contato).replace(' ','T')+'Z').getTime();return Date.now()-t<120000}function render(){$('lista').innerHTML=itens.map(i=>{const on=online(i),st=on?(i.telemetria_status||i.status):((i.telemetria_token_hash)?'offline':i.status);return `<tr><td><strong>${ui.escapeHtml(i.nome)}</strong><br><small>${ui.escapeHtml(i.modelo||'')}</small></td><td>${ui.qty.format(Number(i.bico_mm||0))} mm · ${ui.escapeHtml(i.material_padrao||'—')}<br><small>${ui.escapeHtml(i.integracao_tipo||'manual')}</small></td><td><strong>${on?'● ':''}${ui.escapeHtml(st||'—')}</strong><br><small>${i.telemetria_ultimo_contato?`Último contato: ${ui.escapeHtml(i.telemetria_ultimo_contato)}`:'Sem telemetria'}</small></td><td>${ui.escapeHtml(i.trabalho_atual||'—')}<br><small>${fmt(i.progresso_percentual)}% · ${i.tempo_restante_min==null?'—':i.tempo_restante_min+' min restantes'}</small></td><td>Bico ${fmt(i.temperatura_bico)} °C<br><small>Mesa ${fmt(i.temperatura_mesa)} °C</small></td><td>${ui.escapeHtml(i.localizacao||'—')}</td><td><button data-edit="${i.id}">Editar</button> <button class="secondary" data-token="${i.id}">Gerar chave</button> ${i.telemetria_token_hash?`<button class="secondary" data-revoke="${i.id}">Revogar</button>`:''} <button class="secondary" data-del="${i.id}">Arquivar</button></td></tr>`}).join('')}async function load(){if(!await ui.requireAuth())return;const d=await ui.api('/api/impressoras');itens=d.impressoras||[];render()}function open(i=null){$('form').reset();$('id').value=i?.id||'';$('nome').value=i?.nome||'';$('modelo').value=i?.modelo||'';$('bico').value=i?.bico_mm??0.4;$('material').value=i?.material_padrao||'';$('status').value=i?.status||'livre';$('local').value=i?.localizacao||'';$('obs').value=i?.observacoes||'';$('modal').hidden=false}function close(){$('modal').hidden=true}document.querySelectorAll('[data-close]').forEach(x=>x.onclick=close);$('novo').onclick=()=>open();$('lista').onclick=async e=>{try{const ed=e.target.closest('[data-edit]');if(ed)return open(itens.find(i=>String(i.id)===ed.dataset.edit));const tk=e.target.closest('[data-token]');if(tk){const r=await ui.api('/api/impressoras/integracao',{method:'POST',body:JSON.stringify({id:tk.dataset.token,integracao_tipo:'bridge'})});prompt('Copie esta chave agora. Ela não será mostrada novamente:',r.token);await load();return}const rv=e.target.closest('[data-revoke]');if(rv&&confirm('Revogar a integração desta impressora?')){await ui.api(`/api/impressoras/integracao?id=${rv.dataset.revoke}`,{method:'DELETE'});await load();return}const del=e.target.closest('[data-del]');if(del&&confirm('Arquivar esta impressora?')){await ui.api(`/api/impressoras?id=${del.dataset.del}`,{method:'DELETE'});await load()}}catch(err){ui.feedback($('msg'),err.message,true)}};$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value;await ui.api('/api/impressoras',{method:id?'PUT':'POST',body:JSON.stringify({id:id||undefined,nome:$('nome').value,modelo:$('modelo').value,bico_mm:$('bico').value,material_padrao:$('material').value,status:$('status').value,localizacao:$('local').value,observacoes:$('obs').value})});close();await load();ui.feedback($('msg'),'Impressora salva.')};load();setInterval(()=>load().catch(()=>{}),30000);</script></body></html>
