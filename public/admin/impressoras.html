<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Impressoras | BIRX Admin</title><link rel="stylesheet" href="/admin/css/admin.css?v=1.1"><link rel="stylesheet" href="/admin/css/operacoes.css?v=1.0"></head><body><div class="admin-shell"><aside class="sidebar"><div class="brand"><a href="/"><img src="/assets/login.png" alt="BIRX Pets"></a></div><nav class="menu"><a class="menu-item" href="/admin/">Dashboard</a><a class="menu-item" href="/admin/materiais.html">Materiais</a><a class="menu-item" href="/admin/produtos.html">Produtos</a><a class="menu-item" href="/admin/modelos-3d.html">Modelos 3D</a><a class="menu-item active" href="/admin/impressoras.html">Impressoras</a><a class="menu-item" href="/admin/central-producao.html">Central de Produção</a></nav></aside><main class="main-content"><header class="topbar"><div><span class="eyebrow">FROTA 3D</span><h1>Impressoras</h1></div><button class="primary" id="novo">+ Nova impressora</button></header><section class="panel"><div id="msg" class="feedback" hidden></div><div class="table-wrap"><table><thead><tr><th>Impressora</th><th>Bico</th><th>Material</th><th>Status</th><th>Local</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section></main></div><div class="modal" id="modal" hidden><div class="modal-overlay" data-close></div><section class="modal-card"><div class="modal-head"><h2 id="titulo">Nova impressora</h2><button class="icon-button" data-close>×</button></div><form id="form" class="form-grid"><input id="id" type="hidden"><label>Nome<input id="nome" required placeholder="Ex.: Bambu A1 #1"></label><label>Modelo<input id="modelo" placeholder="Bambu Lab A1"></label><label>Bico (mm)<input id="bico" type="number" step="0.1" value="0.4"></label><label>Material padrão<input id="material" placeholder="PETG"></label><label>Status<select id="status"><option value="livre">Livre</option><option value="imprimindo">Imprimindo</option><option value="pausada">Pausada</option><option value="manutencao">Manutenção</option><option value="offline">Offline</option></select></label><label>Localização<input id="local"></label><label class="full">Observações<textarea id="obs" rows="3"></textarea></label><div class="form-actions full"><button type="button" class="secondary" data-close>Cancelar</button><button class="primary">Salvar</button></div></form></section></div><script src="/admin/js/ui.js?v=1.6"></script><script>const ui=BirxAdmin,$=id=>document.getElementById(id);let itens=[];function render(){$('lista').innerHTML=itens.map(i=>`<tr><td><strong>${ui.escapeHtml(i.nome)}</strong><br><small>${ui.escapeHtml(i.modelo||'')}</small></td><td>${ui.qty.format(Number(i.bico_mm||0))} mm</td><td>${ui.escapeHtml(i.material_padrao||'—')}</td><td><strong>${ui.escapeHtml(i.status)}</strong></td><td>${ui.escapeHtml(i.localizacao||'—')}</td><td><button data-edit="${i.id}">Editar</button> <button class="secondary" data-del="${i.id}">Arquivar</button></td></tr>`).join('')}async function load(){if(!await ui.requireAuth())return;const d=await ui.api('/api/impressoras');itens=d.impressoras||[];render()}function open(i=null){$('form').reset();$('id').value=i?.id||'';$('nome').value=i?.nome||'';$('modelo').value=i?.modelo||'';$('bico').value=i?.bico_mm??0.4;$('material').value=i?.material_padrao||'';$('status').value=i?.status||'livre';$('local').value=i?.localizacao||'';$('obs').value=i?.observacoes||'';$('modal').hidden=false}function close(){$('modal').hidden=true}document.querySelectorAll('[data-close]').forEach(x=>x.onclick=close);$('novo').onclick=()=>open();$('lista').onclick=async e=>{const ed=e.target.closest('[data-edit]');if(ed)return open(itens.find(i=>String(i.id)===ed.dataset.edit));const del=e.target.closest('[data-del]');if(del&&confirm('Arquivar esta impressora?')){await ui.api(`/api/impressoras?id=${del.dataset.del}`,{method:'DELETE'});await load()}};$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value;await ui.api('/api/impressoras',{method:id?'PUT':'POST',body:JSON.stringify({id:id||undefined,nome:$('nome').value,modelo:$('modelo').value,bico_mm:$('bico').value,material_padrao:$('material').value,status:$('status').value,localizacao:$('local').value,observacoes:$('obs').value})});close();await load();ui.feedback($('msg'),'Impressora salva.')};load();</script></body></html>
