<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17388f"><title>Acesso | BIRX Admin</title><link rel="stylesheet" href="/admin/css/admin.css?v=1.1"><style>body{min-height:100vh;display:grid;place-items:center;background:#eef3fb}.login-card{width:min(420px,calc(100% - 32px));padding:28px;border-radius:22px;background:#fff;box-shadow:0 18px 60px rgba(20,40,90,.14)}.login-card img{width:130px}.login-card form{display:grid;gap:12px;margin-top:20px}.login-card label{display:grid;gap:6px;font-weight:800;font-size:.85rem}.login-card input{min-height:46px;padding:0 13px;border:1px solid #d8dfeb;border-radius:11px;font:inherit}.login-card h1{margin:14px 0 4px}.login-card p{color:#687794;margin:0}.login-card button{min-height:46px}</style></head><body><main class="login-card"><img src="/assets/login.png" alt="BIRX Pets"><span class="eyebrow">BIRX INTERNO</span><h1>Área de desenvolvimento</h1><p>Entre com a chave administrativa para visualizar Loja, checkout e módulos internos.</p><form id="formLogin"><label>Chave administrativa<input id="chave" type="password" autocomplete="current-password" required autofocus></label><button class="primary" type="submit">Entrar</button></form><div id="mensagem" class="feedback" hidden></div></main><script>const form=document.getElementById('formLogin'),msg=document.getElementById('mensagem'),input=document.getElementById('chave');const params=new URLSearchParams(location.search);const voltar=params.get('voltar');function destinoSeguro(){if(!voltar||!voltar.startsWith('/')||voltar.startsWith('//'))return'/admin/';return voltar}async function status(){try{const r=await fetch('/api/admin-login',{method:'GET',credentials:'same-origin',cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.ok&&d.autenticado===true)location.replace(destinoSeguro())}catch{}}async function entrar(chave){const r=await fetch('/api/admin-login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({chave})});const d=await r.json().catch(()=>({}));if(!r.ok||d.autenticado!==true)throw new Error(d.mensagem||'Credencial administrativa inválida.');sessionStorage.removeItem('orbitek_tag_admin');sessionStorage.removeItem('birxAdminKey');location.replace(destinoSeguro())}status();form.addEventListener('submit',async e=>{e.preventDefault();msg.hidden=true;const btn=form.querySelector('button');btn.disabled=true;try{await entrar(input.value.trim())}catch(err){msg.textContent=err.message;msg.classList.add('error');msg.hidden=false;btn.disabled=false;input.focus()}});</script></body></html>
