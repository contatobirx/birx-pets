<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modelos 3D | BIRX Admin</title><link rel="stylesheet" href="/admin/css/admin.css?v=1.1"><link rel="stylesheet" href="/admin/css/operacoes.css?v=1.0"></head><body><div class="admin-shell"><aside class="sidebar"><div class="brand"><a href="/"><img src="/assets/login.png" alt="BIRX Pets"></a></div><nav class="menu"><a class="menu-item" href="/admin/">Dashboard</a><a class="menu-item" href="/admin/materiais.html">Materiais</a><a class="menu-item" href="/admin/estoque.html">Estoque</a><a class="menu-item" href="/admin/produtos.html">Produtos</a><a class="menu-item active" href="/admin/modelos-3d.html">Modelos 3D</a><a class="menu-item" href="/admin/precificacao.html">Precificação</a><a class="menu-item" href="/admin/producao-integrada.html">Produção integrada</a></nav></aside><main class="main-content"><header class="topbar"><div><span class="eyebrow">IMPRESSÃO 3D</span><h1>Modelos 3D</h1></div><button class="primary" id="novo">+ Novo modelo</button></header><section class="panel"><div class="toolbar"><div><span class="eyebrow">BIBLIOTECA</span><h3>Arquivos e parâmetros de impressão</h3><p class="muted">Cadastre peso, tempo, versão e impressora recomendada para cada produto.</p></div><input id="busca" type="search" placeholder="Buscar modelo ou produto"></div><div id="msg" class="feedback" hidden></div><div class="table-wrap"><table><thead><tr><th>Produto / Modelo</th><th>Arquivo</th><th>Peso</th><th>Tempo</th><th>Impressão</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section></main></div><div class="modal" id="modal" hidden><div class="modal-overlay" data-close></div><section class="modal-card"><div class="modal-head"><h2 id="titulo">Novo modelo 3D</h2><button class="icon-button" data-close>×</button></div><form id="form" class="form-grid"><input id="id" type="hidden"><label class="full">Produto<select id="produto" required></select></label><label>Nome do modelo<input id="nome" required placeholder="Ex.: Birx ID Redonda"></label><label>Versão<input id="versao" placeholder="v3"></label><label>Nome do arquivo<input id="arquivo" placeholder="Birx_ID_Redonda_v3.3mf"></label><label>Link do arquivo<input id="url" placeholder="Opcional"></label><label>Peso da peça (g)<input id="peso" type="number" min="0" step="0.01"></label><label>Tempo (min)<input id="tempo" type="number" min="0" step="1"></label><label>Impressora<input id="impressora" placeholder="Ex.: Bambu Lab A1"></label><label>Bico (mm)<input id="bico" type="number" min="0" step="0.1" value="0.4"></label><label>Material<input id="material" placeholder="PETG, PLA, TPU"></label><label class="full">Observações<textarea id="obs" rows="3"></textarea></label><div class="form-actions full"><button type="button" class="secondary" data-close>Cancelar</button><button class="primary" type="submit">Salvar</button></div></form><div id="modalMsg" class="feedback" hidden></div></section></div><script src="/admin/js/ui.js?v=1.5"></script><script>const ui=BirxAdmin,$=id=>document.getElementById(id);let modelos=[],produtos=[];function tempo(n){n=Number(n||0);return n>=60?`${Math.floor(n/60)}h ${n%60}min`:`${n} min`}function render(){const q=$('busca').value.toLowerCase();$('lista').innerHTML=modelos.filter(m=>`${m.produto_nome} ${m.nome} ${m.arquivo_nome||''} ${m.impressora||''}`.toLowerCase().includes(q)).map(m=>`<tr><td><strong>${ui.escapeHtml(m.produto_nome)}</strong><br><small>${ui.escapeHtml(m.nome)} ${ui.escapeHtml(m.versao||'')}</small></td><td>${ui.escapeHtml(m.arquivo_nome||'—')}${m.arquivo_url?`<br><a href="${ui.escapeHtml(m.arquivo_url)}" target="_blank" rel="noopener">Abrir</a>`:''}</td><td>${ui.qty.format(Number(m.peso_g||0))} g</td><td>${tempo(m.tempo_minutos)}</td><td>${ui.escapeHtml(m.impressora||'—')}<br><small>${m.bico_mm?`${ui.qty.format(Number(m.bico_mm))} mm · `:''}${ui.escapeHtml(m.material_tipo||'')}</small></td><td><button data-edit="${m.id}">Editar</button> <button class="secondary" data-del="${m.id}">Arquivar</button></td></tr>`).join('')}async function load(){if(!await ui.requireAuth())return;const[d,p]=await Promise.all([ui.api('/api/modelos-3d'),ui.api('/api/produtos')]);modelos=d.modelos||[];produtos=p.produtos||[];$('produto').innerHTML='<option value="">Selecione</option>'+produtos.map(x=>`<option value="${x.id}">${ui.escapeHtml(x.nome)}</option>`).join('');render()}function open(m=null){$('form').reset();$('id').value=m?.id||'';$('titulo').textContent=m?'Editar modelo 3D':'Novo modelo 3D';$('produto').value=m?.produto_id||'';$('nome').value=m?.nome||'';$('versao').value=m?.versao||'';$('arquivo').value=m?.arquivo_nome||'';$('url').value=m?.arquivo_url||'';$('peso').value=m?.peso_g??0;$('tempo').value=m?.tempo_minutos??0;$('impressora').value=m?.impressora||'';$('bico').value=m?.bico_mm??0.4;$('material').value=m?.material_tipo||'';$('obs').value=m?.observacoes||'';$('modal').hidden=false}function close(){$('modal').hidden=true}document.querySelectorAll('[data-close]').forEach(x=>x.onclick=close);$('novo').onclick=()=>open();$('busca').oninput=render;$('lista').onclick=async e=>{const ed=e.target.closest('[data-edit]');if(ed)return open(modelos.find(m=>String(m.id)===ed.dataset.edit));const del=e.target.closest('[data-del]');if(del&&confirm('Arquivar este modelo?')){await ui.api(`/api/modelos-3d?id=${del.dataset.del}`,{method:'DELETE'});await load()}};$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value,p={id:id||undefined,produto_id:$('produto').value,nome:$('nome').value,versao:$('versao').value,arquivo_nome:$('arquivo').value,arquivo_url:$('url').value,peso_g:$('peso').value,tempo_minutos:$('tempo').value,impressora:$('impressora').value,bico_mm:$('bico').value,material_tipo:$('material').value,observacoes:$('obs').value};try{await ui.api('/api/modelos-3d',{method:id?'PUT':'POST',body:JSON.stringify(p)});close();await load();ui.feedback($('msg'),id?'Modelo atualizado.':'Modelo cadastrado.')}catch(err){ui.feedback($('modalMsg'),err.message,true)}};load();</script></body></html>
