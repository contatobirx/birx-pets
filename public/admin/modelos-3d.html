<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modelos 3D | BIRX Admin</title><link rel="stylesheet" href="/admin/css/admin.css?v=1.1"><link rel="stylesheet" href="/admin/css/operacoes.css?v=1.0"></head><body><div class="admin-shell"><aside class="sidebar"><div class="brand"><a href="/"><img src="/assets/login.png" alt="BIRX Pets"></a></div><nav class="menu"><a class="menu-item" href="/admin/">Dashboard</a><a class="menu-item" href="/admin/materiais.html">Materiais</a><a class="menu-item" href="/admin/produtos.html">Produtos</a><a class="menu-item active" href="/admin/modelos-3d.html">Modelos 3D</a><a class="menu-item" href="/admin/impressoras.html">Impressoras</a><a class="menu-item" href="/admin/central-producao.html">Central de Produção</a><a class="menu-item" href="/admin/precificacao.html">Precificação</a></nav></aside><main class="main-content"><header class="topbar"><div><span class="eyebrow">IMPRESSÃO 3D</span><h1>Modelos 3D</h1></div><button class="primary" id="novo">+ Novo modelo</button></header><section class="panel"><div class="toolbar"><div><span class="eyebrow">BIBLIOTECA</span><h3>Arquivos e parâmetros de impressão</h3><p class="muted">Arquivos .3mf/.stl ficam privados no Cloudflare R2.</p></div><input id="busca" type="search" placeholder="Buscar modelo ou produto"></div><div id="msg" class="feedback" hidden></div><div class="table-wrap"><table><thead><tr><th>Produto / Modelo</th><th>Arquivo R2</th><th>Peso</th><th>Tempo</th><th>Impressão</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section></main></div><div class="modal" id="modal" hidden><div class="modal-overlay" data-close></div><section class="modal-card"><div class="modal-head"><h2 id="titulo">Novo modelo 3D</h2><button class="icon-button" data-close>×</button></div><form id="form" class="form-grid"><input id="id" type="hidden"><label class="full">Produto<select id="produto" required></select></label><label>Nome do modelo<input id="nome" required></label><label>Versão<input id="versao" placeholder="v3"></label><label>Peso da peça (g)<input id="peso" type="number" min="0" step="0.01"></label><label>Tempo (min)<input id="tempo" type="number" min="0" step="1"></label><label>Impressora recomendada<input id="impressora"></label><label>Bico (mm)<input id="bico" type="number" min="0" step="0.1" value="0.4"></label><label>Material<input id="material" placeholder="PETG, PLA, TPU"></label><label class="full">Arquivo 3D<input id="upload" type="file" accept=".3mf,.stl,.obj"></label><label class="full">Observações<textarea id="obs" rows="3"></textarea></label><div class="form-actions full"><button type="button" class="secondary" data-close>Cancelar</button><button class="primary" type="submit">Salvar</button></div></form><div id="modalMsg" class="feedback" hidden></div></section></div><script src="/admin/js/ui.js?v=1.6"></script><script>const ui=BirxAdmin,$=id=>document.getElementById(id);let modelos=[],produtos=[];function tempo(n){n=Number(n||0);return n>=60?`${Math.floor(n/60)}h ${n%60}min`:`${n} min`}function render(){const q=$('busca').value.toLowerCase();$('lista').innerHTML=modelos.filter(m=>`${m.produto_nome} ${m.nome} ${m.arquivo_nome||''}`.toLowerCase().includes(q)).map(m=>`<tr><td><strong>${ui.escapeHtml(m.produto_nome)}</strong><br><small>${ui.escapeHtml(m.nome)} ${ui.escapeHtml(m.versao||'')}</small></td><td>${m.r2_key?`<strong>${ui.escapeHtml(m.arquivo_nome||'Arquivo')}</strong><br><small>${ui.qty.format(Number(m.arquivo_tamanho||0)/1024)} KB</small>`:'Sem arquivo'}</td><td>${ui.qty.format(Number(m.peso_g||0))} g</td><td>${tempo(m.tempo_minutos)}</td><td>${ui.escapeHtml(m.impressora||'—')}<br><small>${m.bico_mm?`${ui.qty.format(Number(m.bico_mm))} mm · `:''}${ui.escapeHtml(m.material_tipo||'')}</small></td><td><button data-edit="${m.id}">Editar</button> ${m.r2_key?`<button class="secondary" data-down="${m.id}">Baixar</button> <button class="secondary" data-rmfile="${m.id}">Remover arquivo</button>`:''} <button class="secondary" data-del="${m.id}">Arquivar</button></td></tr>`).join('')}async function load(){if(!await ui.requireAuth())return;const[d,p]=await Promise.all([ui.api('/api/modelos-3d'),ui.api('/api/produtos')]);modelos=d.modelos||[];produtos=p.produtos||[];$('produto').innerHTML='<option value="">Selecione</option>'+produtos.map(x=>`<option value="${x.id}">${ui.escapeHtml(x.nome)}</option>`).join('');render()}function open(m=null){$('form').reset();$('id').value=m?.id||'';$('titulo').textContent=m?'Editar modelo 3D':'Novo modelo 3D';$('produto').value=m?.produto_id||'';$('nome').value=m?.nome||'';$('versao').value=m?.versao||'';$('peso').value=m?.peso_g??0;$('tempo').value=m?.tempo_minutos??0;$('impressora').value=m?.impressora||'';$('bico').value=m?.bico_mm??0.4;$('material').value=m?.material_tipo||'';$('obs').value=m?.observacoes||'';$('modal').hidden=false}function close(){$('modal').hidden=true}async function upload(id,file){if(!file)return;const fd=new FormData();fd.append('modelo_id',id);fd.append('arquivo',file);const r=await fetch('/api/modelos-3d/arquivo',{method:'POST',headers:{'X-BIRX-Admin':ui.getKey()},body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.mensagem||'Falha no upload ao R2.')}async function baixar(id){const r=await fetch(`/api/modelos-3d/arquivo?modelo_id=${id}`,{headers:{'X-BIRX-Admin':ui.getKey()}});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.mensagem||'Falha no download.')}const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;const m=modelos.find(x=>String(x.id)===String(id));a.download=m?.arquivo_nome||'modelo.3mf';a.click();URL.revokeObjectURL(u)}document.querySelectorAll('[data-close]').forEach(x=>x.onclick=close);$('novo').onclick=()=>open();$('busca').oninput=render;$('lista').onclick=async e=>{try{const ed=e.target.closest('[data-edit]');if(ed)return open(modelos.find(m=>String(m.id)===ed.dataset.edit));const down=e.target.closest('[data-down]');if(down)return await baixar(down.dataset.down);const rm=e.target.closest('[data-rmfile]');if(rm&&confirm('Remover o arquivo do R2?')){await ui.api(`/api/modelos-3d/arquivo?modelo_id=${rm.dataset.rmfile}`,{method:'DELETE'});await load();return}const del=e.target.closest('[data-del]');if(del&&confirm('Arquivar este modelo?')){await ui.api(`/api/modelos-3d?id=${del.dataset.del}`,{method:'DELETE'});await load()}}catch(err){ui.feedback($('msg'),err.message,true)}};$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value,p={id:id||undefined,produto_id:$('produto').value,nome:$('nome').value,versao:$('versao').value,peso_g:$('peso').value,tempo_minutos:$('tempo').value,impressora:$('impressora').value,bico_mm:$('bico').value,material_tipo:$('material').value,observacoes:$('obs').value};try{const d=await ui.api('/api/modelos-3d',{method:id?'PUT':'POST',body:JSON.stringify(p)});const modelId=id||d.id;await upload(modelId,$('upload').files[0]);close();await load();ui.feedback($('msg'),'Modelo e arquivo salvos.')}catch(err){ui.feedback($('modalMsg'),err.message,true)}};load();</script></body></html>
