<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Produção | BIRX Admin</title><link rel="stylesheet" href="/admin/css/admin.css?v=1.1"><link rel="stylesheet" href="/admin/css/operacoes.css?v=1.0"></head><body><div class="admin-shell"><aside class="sidebar"><div class="brand"><a href="/"><img src="/assets/login.png" alt="BIRX Pets"></a></div><nav class="menu"><a class="menu-item" href="/admin/">Dashboard</a><a class="menu-item" href="/admin/materiais.html">Materiais</a><a class="menu-item" href="/admin/produtos.html">Produtos</a><a class="menu-item" href="/admin/modelos-3d.html">Modelos 3D</a><a class="menu-item" href="/admin/impressoras.html">Impressoras</a><a class="menu-item active" href="/admin/central-producao.html">Central de Produção</a></nav></aside><main class="main-content"><header class="topbar"><div><span class="eyebrow">OPERAÇÃO 3D</span><h1>Central de Produção</h1></div><button class="primary" id="nova">+ Nova ordem</button></header><div id="msg" class="feedback" hidden></div><section class="stats-grid" id="cards"></section><section class="panel"><div class="panel-header"><div><span class="eyebrow">ORDENS</span><h3>Fila e impressão</h3></div></div><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Modelo</th><th>Impressora</th><th>Qtde</th><th>Previsto</th><th>Status</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section></main></div><div class="modal" id="modal" hidden><div class="modal-overlay" data-close></div><section class="modal-card"><div class="modal-head"><h2>Nova ordem</h2><button class="icon-button" data-close>×</button></div><form id="form" class="form-grid"><label>Produto<select id="produto" required></select></label><label>Modelo 3D<select id="modelo"></select></label><label>Impressora<select id="impressora"></select></label><label>Quantidade<input id="quantidade" type="number" min="1" step="1" value="1"></label><label class="full">Observações<textarea id="obs" rows="3"></textarea></label><div class="form-actions full"><button type="button" class="secondary" data-close>Cancelar</button><button class="primary">Criar ordem</button></div></form></section></div><script src="/admin/js/ui.js?v=1.6"></script><script>const ui=BirxAdmin,$=id=>document.getElementById(id);let ordens=[],impressoras=[],produtos=[],modelos=[];const tempo=n=>{n=Number(n||0);return n>=60?`${Math.floor(n/60)}h ${n%60}min`:`${n} min`};function renderCards(){$('cards').innerHTML=impressoras.map(i=>`<article class="stat-card"><div class="stat-icon">🖨️</div><div><span>${ui.escapeHtml(i.nome)}</span><strong>${ui.escapeHtml(i.status)}</strong><small>${ui.escapeHtml(i.modelo||'')}</small></div></article>`).join('')||'<div class="empty">Cadastre suas impressoras.</div>'}function render(){renderCards();$('lista').innerHTML=ordens.map(o=>`<tr><td><strong>${ui.escapeHtml(o.produto_nome)}</strong></td><td>${ui.escapeHtml(o.modelo_nome||'—')} <small>${ui.escapeHtml(o.versao||'')}</small></td><td><select data-printer="${o.id}"><option value="">Sem impressora</option>${impressoras.map(i=>`<option value="${i.id}" ${String(i.id)===String(o.impressora_id)?'selected':''}>${ui.escapeHtml(i.nome)}</option>`).join('')}</select></td><td>${o.quantidade}</td><td>${ui.qty.format(Number(o.peso_previsto_g||0))} g · ${tempo(o.tempo_previsto_min)}</td><td><strong>${ui.escapeHtml(o.status)}</strong></td><td><button data-status="imprimindo" data-id="${o.id}">Iniciar</button> <button class="secondary" data-status="pausada" data-id="${o.id}">Pausar</button> <button class="secondary" data-status="concluida" data-id="${o.id}">Concluir</button> <button class="secondary" data-status="cancelada" data-id="${o.id}">Cancelar</button></td></tr>`).join('')}async function load(){if(!await ui.requireAuth())return;const[d,p,m]=await Promise.all([ui.api('/api/central-producao'),ui.api('/api/produtos'),ui.api('/api/modelos-3d')]);ordens=d.ordens||[];impressoras=d.impressoras||[];produtos=p.produtos||[];modelos=m.modelos||[];$('produto').innerHTML='<option value="">Selecione</option>'+produtos.map(x=>`<option value="${x.id}">${ui.escapeHtml(x.nome)}</option>`).join('');$('impressora').innerHTML='<option value="">Depois</option>'+impressoras.map(x=>`<option value="${x.id}">${ui.escapeHtml(x.nome)}</option>`).join('');filtrarModelos();render()}function filtrarModelos(){$('modelo').innerHTML='<option value="">Sem modelo</option>'+modelos.filter(m=>String(m.produto_id)===String($('produto').value)).map(m=>`<option value="${m.id}">${ui.escapeHtml(m.nome)} ${ui.escapeHtml(m.versao||'')}</option>`).join('')}$('produto').onchange=filtrarModelos;$('nova').onclick=()=>{$('form').reset();filtrarModelos();$('modal').hidden=false};document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>{$('modal').hidden=true});$('form').onsubmit=async e=>{e.preventDefault();await ui.api('/api/central-producao',{method:'POST',body:JSON.stringify({produto_id:$('produto').value,modelo_3d_id:$('modelo').value,impressora_id:$('impressora').value,quantidade:$('quantidade').value,observacoes:$('obs').value})});$('modal').hidden=true;await load();ui.feedback($('msg'),'Ordem criada.')};$('lista').onclick=async e=>{const b=e.target.closest('[data-status]');if(!b)return;const sel=$(`lista`).querySelector(`[data-printer="${b.dataset.id}"]`);await ui.api('/api/central-producao',{method:'PUT',body:JSON.stringify({id:b.dataset.id,status:b.dataset.status,impressora_id:sel?.value||null})});await load()};$('lista').onchange=async e=>{const s=e.target.closest('[data-printer]');if(!s)return;const o=ordens.find(x=>String(x.id)===s.dataset.printer);if(!o)return;await ui.api('/api/central-producao',{method:'PUT',body:JSON.stringify({id:o.id,status:o.status,impressora_id:s.value||null})});await load()};load();</script></body></html>
