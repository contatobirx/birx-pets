<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos | BIRX Admin</title><link rel="stylesheet" href="/admin/css/admin.css?v=1.1"><link rel="stylesheet" href="/admin/css/operacoes.css?v=1.0"></head><body><div class="admin-shell"><aside class="sidebar"><div class="brand"><a href="/"><img src="/assets/login.png" alt="BIRX Pets"></a></div><nav class="menu"><a class="menu-item" href="/admin/">Dashboard</a><a class="menu-item" href="/admin/crm.html">CRM</a><a class="menu-item active" href="/admin/pedidos.html">Pedidos</a><a class="menu-item" href="/admin/produtos.html">Produtos</a><a class="menu-item" href="/admin/central-producao.html">Central de Produção</a></nav></aside><main class="main-content"><header class="topbar"><div><span class="eyebrow">VENDAS</span><h1>Pedidos</h1></div><button class="primary" id="novo">+ Novo pedido</button></header><div id="msg" class="feedback" hidden></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>#</th><th>Cliente</th><th>Status</th><th>Total</th><th>Produção</th><th>Entrega</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section><section class="panel" id="detalhe" hidden><div class="panel-header"><div><span class="eyebrow">PEDIDO</span><h3 id="pedidoTitulo"></h3></div><div><button class="secondary" data-status="confirmado">Confirmar</button> <button class="secondary" data-status="producao">Produção</button> <button class="secondary" data-status="pronto">Pronto</button> <button class="primary" data-status="entregue">Entregue</button> <button class="secondary" data-status="cancelado">Cancelar</button></div></div><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Qtd</th><th>Reservado</th><th>Produção?</th><th>Preço</th><th>Subtotal</th><th></th></tr></thead><tbody id="itens"></tbody></table></div><form id="formItem" class="form-grid"><label>Produto<select id="produto"></select></label><label>Quantidade<input id="quantidade" type="number" min="1" value="1"></label><label>Preço unitário<input id="preco" type="number" min="0" step="0.01"></label><div class="form-actions"><button class="primary">Adicionar item</button></div></form></section></main></div><div class="modal" id="modal" hidden><div class="modal-overlay" data-close></div><section class="modal-card"><div class="modal-head"><h2>Novo pedido</h2><button class="icon-button" data-close>×</button></div><form id="formPedido" class="form-grid"><label class="full">Cliente<select id="cliente"></select></label><label>Previsão de entrega<input id="previsao" type="date"></label><label>Frete<input id="frete" type="number" min="0" step="0.01" value="0"></label><label>Desconto<input id="desconto" type="number" min="0" step="0.01" value="0"></label><label class="full">Observações<textarea id="obs" rows="3"></textarea></label><div class="form-actions full"><button type="button" class="secondary" data-close>Cancelar</button><button class="primary">Criar pedido</button></div></form></section></div><script src="/admin/js/ui.js?v=1.10"></script><script>const ui=BirxAdmin,$=id=>document.getElementById(id);let pedidos=[],clientes=[],produtos=[],pedidoAtual=null;function renderLista(){$('lista').innerHTML=pedidos.map(p=>`<tr><td>#${p.id}</td><td>${ui.escapeHtml(p.cliente_nome||'Sem cliente')}</td><td><strong>${ui.escapeHtml(p.status)}</strong></td><td>${ui.money.format(Number(p.total||0))}</td><td>${Number(p.itens_producao||0)>0?`<strong>${p.itens_producao} item(ns)</strong>`:'Não'}</td><td>${ui.escapeHtml((p.previsao_entrega||'—').slice(0,10))}</td><td><button data-open="${p.id}">Abrir</button></td></tr>`).join('')}async function load(){if(!await ui.requireAuth())return;const[d,c,p]=await Promise.all([ui.api('/api/pedidos'),ui.api('/api/crm'),ui.api('/api/produtos')]);pedidos=d.pedidos||[];clientes=c.contatos||[];produtos=p.produtos||[];$('cliente').innerHTML='<option value="">Sem cliente</option>'+clientes.map(x=>`<option value="${x.id}">${ui.escapeHtml(x.nome)}</option>`).join('');$('produto').innerHTML='<option value="">Selecione</option>'+produtos.map(x=>`<option value="${x.id}" data-preco="${x.preco_venda||0}">${ui.escapeHtml(x.nome)}</option>`).join('');const qp=new URLSearchParams(location.search).get('cliente_id');if(qp)$('cliente').value=qp;renderLista()}async function abrir(id){const d=await ui.api(`/api/pedidos?id=${id}`);pedidoAtual=d.pedido;$('detalhe').hidden=false;$('pedidoTitulo').textContent=`#${pedidoAtual.id} — ${pedidoAtual.cliente_nome||'Sem cliente'} — ${ui.money.format(Number(pedidoAtual.total||0))}`;$('itens').innerHTML=(d.itens||[]).map(i=>`<tr><td>${ui.escapeHtml(i.produto_nome)}</td><td>${i.quantidade}</td><td>${i.quantidade_reservada}</td><td>${i.producao_necessaria?'Sim':'Não'}</td><td>${ui.money.format(Number(i.preco_unitario||0))}</td><td>${ui.money.format(Number(i.subtotal||0))}</td><td><button class="secondary" data-delitem="${i.id}">Remover</button></td></tr>`).join('')}function close(){$('modal').hidden=true}document.querySelectorAll('[data-close]').forEach(x=>x.onclick=close);$('novo').onclick=()=>{$('formPedido').reset();$('modal').hidden=false};$('lista').onclick=e=>{const b=e.target.closest('[data-open]');if(b)abrir(b.dataset.open)};$('produto').onchange=()=>{const o=$('produto').selectedOptions[0];$('preco').value=o?.dataset.preco||''};$('formPedido').onsubmit=async e=>{e.preventDefault();const d=await ui.api('/api/pedidos',{method:'POST',body:JSON.stringify({cliente_id:$('cliente').value,previsao_entrega:$('previsao').value,frete:$('frete').value,desconto:$('desconto').value,observacoes:$('obs').value})});close();await load();await abrir(d.id)};$('formItem').onsubmit=async e=>{e.preventDefault();if(!pedidoAtual)return;const d=await ui.api('/api/pedidos',{method:'POST',body:JSON.stringify({acao:'item',pedido_id:pedidoAtual.id,produto_id:$('produto').value,quantidade:$('quantidade').value,preco_unitario:$('preco').value})});ui.feedback($('msg'),d.mensagem);await load();await abrir(pedidoAtual.id)};$('detalhe').onclick=async e=>{const st=e.target.closest('[data-status]');if(st&&pedidoAtual){try{await ui.api('/api/pedidos',{method:'PUT',body:JSON.stringify({id:pedidoAtual.id,status:st.dataset.status})});await load();await abrir(pedidoAtual.id);ui.feedback($('msg'),'Pedido atualizado.')}catch(err){ui.feedback($('msg'),err.message,true)}return}const rm=e.target.closest('[data-delitem]');if(rm&&pedidoAtual&&confirm('Remover item?')){await ui.api(`/api/pedidos?item_id=${rm.dataset.delitem}`,{method:'DELETE'});await load();await abrir(pedidoAtual.id)}};load();</script></body></html>
