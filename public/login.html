<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar | Orbitek Pets</title>

    <link
        rel="stylesheet"
        href="/css/login.css"
    >
</head>

<body>
    <main class="pagina-login">
        <section class="cartao-login">
            <header class="cabecalho-login">
                <a
                    href="/"
                    class="marca"
                >
                    Orbitek Pets
                </a>

                <h1>
                    Acesse o perfil do seu pet
                </h1>

                <p>
                    Entre usando o mesmo e-mail
                    cadastrado na tag.
                </p>
            </header>

            <section
                id="etapaEmail"
                class="etapa-login"
            >
                <form id="formEmail">
                    <label for="email">
                        E-mail cadastrado
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        inputmode="email"
                        autocomplete="email"
                        placeholder="seuemail@exemplo.com"
                        required
                    >

                    <p class="ajuda-campo">
                        Enviaremos um código para confirmar
                        que este e-mail pertence a você.
                    </p>

                    <button
                        id="botaoEnviarCodigo"
                        type="submit"
                        class="botao-principal"
                    >
                        Receber código
                    </button>
                </form>
            </section>

            <section
                id="etapaCodigo"
                class="etapa-login escondido"
            >
                <button
                    id="botaoAlterarEmail"
                    type="button"
                    class="botao-alterar"
                >
                    ← Alterar e-mail
                </button>

                <div class="titulo-etapa">
                    <h2>
                        Digite o código
                    </h2>

                    <p id="descricaoCodigo">
                        Enviamos um código para o seu e-mail.
                    </p>
                </div>

                <form id="formCodigo">
                    <label for="codigo">
                        Código de verificação
                    </label>

                    <input
                        id="codigo"
                        name="codigo"
                        class="campo-codigo"
                        type="text"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        placeholder="000000"
                        maxlength="6"
                        required
                    >

                    <button
                        id="botaoEntrar"
                        type="submit"
                        class="botao-principal"
                    >
                        Entrar
                    </button>
                </form>

                <button
                    id="botaoReenviar"
                    type="button"
                    class="botao-secundario"
                >
                    Reenviar código
                </button>
            </section>

            <div
                id="mensagemSistema"
                class="mensagem-sistema escondido"
                role="alert"
            ></div>

            <footer class="rodape-login">
                <p>
                    Seu e-mail será utilizado somente para
                    identificar e proteger sua conta.
                </p>
            </footer>
        </section>
    </main>

    <script src="/js/login.js?v=3"></script>
</body>
</html>
